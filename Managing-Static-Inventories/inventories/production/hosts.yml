---
# Production Environment Static Inventory
# This inventory demonstrates advanced static inventory management

all:
  children:
    # Web Server Group
    webservers:
      hosts:
        web01.example.com:
          ansible_host: 192.168.1.10
          ansible_user: webadmin
          server_role: primary
          max_connections: 1000
        web02.example.com:
          ansible_host: 192.168.1.11
          ansible_user: webadmin
          server_role: secondary
          max_connections: 800
        web03.example.com:
          ansible_host: 192.168.1.12
          ansible_user: webadmin
          server_role: secondary
          max_connections: 800
      vars:
        http_port: 80
        https_port: 443
        service_name: nginx
        environment: production
        backup_enabled: true
        monitoring_enabled: true

    # Database Server Group
    databases:
      hosts:
        db01.example.com:
          ansible_host: 192.168.1.20
          ansible_user: dbadmin
          db_role: master
          max_connections: 500
        db02.example.com:
          ansible_host: 192.168.1.21
          ansible_user: dbadmin
          db_role: slave
          max_connections: 300
      vars:
        db_port: 3306
        service_name: mysql
        environment: production
        backup_schedule: "0 2 * * *"
        replication_enabled: true

    # Load Balancer Group
    loadbalancers:
      hosts:
        lb01.example.com:
          ansible_host: 192.168.1.30
          ansible_user: lbadmin
          lb_algorithm: round_robin
        lb02.example.com:
          ansible_host: 192.168.1.31
          ansible_user: lbadmin
          lb_algorithm: least_connections
      vars:
        service_name: haproxy
        environment: production
        health_check_interval: 30

    # Monitoring Group
    monitoring:
      hosts:
        monitor01.example.com:
          ansible_host: 192.168.1.40
          ansible_user: monitor
          monitoring_type: primary
      vars:
        service_name: prometheus
        environment: production
        retention_days: 30

  # Global variables for all hosts
  vars:
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    domain_name: example.com
    timezone: America/New_York
    ntp_servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
    dns_servers:
      - 8.8.8.8
      - 8.8.4.4
