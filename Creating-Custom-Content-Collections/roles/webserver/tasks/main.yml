---
# tasks file for webserver
- name: Install Apache web server
  package:
    name: "{{ web_package_name }}"
    state: present
  become: yes

- name: Start and enable Apache service
  service:
    name: "{{ web_service_name }}"
    state: started
    enabled: yes
  become: yes

- name: Create custom index page
  template:
    src: index.html.j2
    dest: "{{ web_document_root }}/index.html"
    owner: "{{ web_user }}"
    group: "{{ web_group }}"
    mode: '0644'
  become: yes
  notify: restart webserver

- name: Configure firewall for web traffic
  firewalld:
    service: http
    permanent: yes
    state: enabled
    immediate: yes
  become: yes
  when: ansible_os_family == "RedHat"
---
# tasks file for .
